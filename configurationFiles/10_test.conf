server {
    listen 8080;
    server_name localhost;
    root ./www;
    index index.html;
    client_max_body_size 10000;

    # GET basique
    location / {
        allow_methods GET;
    }

    # POST upload
    location /upload {
        allow_methods POST DELETE;
        upload_path ./www/upload/;
    }

    # DELETE
    location /delete {
        allow_methods GET DELETE;
    }

    # Redirection
    location /old-page {
        return 301 /index.html;
    }

    # CGI
    location /cgi-bin {
        allow_methods GET POST;
        cgi_ext .py;
        cgi_bin /usr/bin/python3;
    }
}